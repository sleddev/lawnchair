name: Build release APK

on:
  workflow_dispatch:
    inputs:
      play-bundle:
        description: 'Also build the Play Store bundle (runs R8 a second time, roughly doubles build time)'
        type: boolean
        default: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
          # Default is read-only off the default branch, so dispatches on other
          # branches never saved their own cache and always built cold.
          cache-read-only: false
      - name: Write sign info
        if: github.repository_owner == 'sleddev'
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi
      - name: Build release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease ${{ inputs.play-bundle && 'bundleLawnWithQuickstepPlayRelease' || '' }} -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release APK
          path: build/outputs/*

